spring.application.name=demo
spring.thymeleaf.cache=false

# Use PostgreSQL as the datasource (external DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/ThirdPrakt
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1

# If you want to use H2 in-memory for development, uncomment the lines below and comment out the Postgres lines above
# spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# If you want to use a different Postgres server, change the URL/credentials above

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (left enabled only if H2 is used)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Use custom error page
server.error.whitelabel.enabled=false
server.error.include-message=always
