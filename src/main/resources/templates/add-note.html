<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Добавить заметку</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/}" sec:authorize="isAuthenticated()">Главная</a>
        <a th:href="@{/houses}" sec:authorize="isAuthenticated()">Дома</a>
        <a th:href="@{/persons}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Города</a>
        <a th:href="@{/notes}" sec:authorize="hasRole('ADMIN')">Заметки</a>
        <a th:href="@{/ownerships}" sec:authorize="hasRole('ADMIN')">Владения</a>
        <span style="float:right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()">Регистрация</a>
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>

      <h1>Добавить заметку</h1>
      <form th:action="@{/notes/add}" th:object="${note}" method="post">
        <div class="form-group" style="flex-direction: column; gap: 15px">
          <div>
            <label>Текст: <textarea th:field="*{text}" rows="4" cols="60"></textarea></label>
          </div>
          <div>
            <label>Автор:
              <select th:field="*{authorId}">
                <option th:each="p : ${persons}" th:value="${p.id}" th:text="${p.name}"></option>
              </select>
            </label>
          </div>
          <div>
            <button type="submit">Сохранить</button>
            <a th:href="@{/notes}" style="margin-left: 10px; color: #3498db; text-decoration: none">Назад</a>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
