<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
</head>
<body>
<header>
    <a href="calculator">Калькулятор</a>
</header>
<div class="converter">
    <form th:action="@{/convert}" method="get">
        <div class="field">
            <textarea class="number" name="amount1" th:text="${amount1}"></textarea>
            <div class="select">
                <select name="currency1" th:value="${currency1}">
                    <option value="rub" th:selected="${currency1 == 'rub'}">₽</option>
                    <option value="usd" th:selected="${currency1 == 'usd'}">$</option>
                    <option value="CNY" th:selected="${currency1 == 'CNY'}">¥</option>
                </select>
            </div>
        </div>
        <button class="equal" type="submit">=</button>
        <div class="field">
            <textarea class="number" name="amount2" readonly th:text="${amount2}"></textarea>
            <div class="select">
                <select name="currency2" th:value="${currency2}">
                    <option value="rub" th:selected="${currency2 == 'rub'}">₽</option>
                    <option value="usd" th:selected="${currency2 == 'usd'}">$</option>
                    <option value="CNY" th:selected="${currency2 == 'CNY'}">¥</option>
                </select>
            </div>
        </div>
    </form>
</div>
</body>
</html>
