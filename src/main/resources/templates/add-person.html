<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить человека</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <h1>Добавить человека</h1>

    <form th:action="@{/persons/add}" th:object="${person}" method="post">
        <div class="form-group" style="flex-direction: column; gap: 15px;">
            <div>
                <label>Имя: <input th:field="*{name}" style="width: 300px;"/></label>
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
            </div>
            <div>
                <label>Возраст: <input th:field="*{age}" style="width: 100px;"/></label>
                <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="error"></span>
            </div>
            <div>
                <label>Город: <input th:field="*{city}" style="width: 300px;"/></label>
                <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="error"></span>
            </div>
            <div>
                <label>Пол (M/F): <input th:field="*{gender}" style="width: 60px;"/></label>
                <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="error"></span>
            </div>
            <div>
                <button type="submit">Сохранить</button>
                <a th:href="@{/persons}" style="margin-left: 10px; color: #3498db; text-decoration: none;">Назад</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
