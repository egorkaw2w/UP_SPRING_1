<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title
      th:text="${person.id != null ? 'Редактировать человека' : 'Добавить человека'}"
    >
      Добавить человека
    </title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/persons}" sec:authorize="hasRole('USER')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasRole('MANAGER')">Города</a>
        <a th:href="@{/houses}" sec:authorize="hasRole('ADMIN')">Дома</a>
        <span style="float: right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()"
            >Регистрация</a
          >
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>

      <h1
        th:text="${person.id != null ? 'Редактировать человека' : 'Добавить человека'}"
      >
        Добавить человека
      </h1>

      <div th:if="${error}" class="alert error" th:text="${error}"></div>

      <form
        th:action="${person != null and person.id != null ? '/persons/update' : '/persons/add'}"
        th:object="${person}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />
        <div class="form-group" style="flex-direction: column; gap: 15px">
          <div>
            <label
              >Имя: <input th:field="*{name}" style="width: 300px"
            /></label>
            <span
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Возраст:
              <input th:field="*{age}" type="number" style="width: 100px"
            /></label>
            <span
              th:if="${#fields.hasErrors('age')}"
              th:errors="*{age}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Город:
              <select th:field="*{city.id}" style="width: 300px">
                <option value="">Выберите город</option>
                <option
                  th:each="c : ${cities}"
                  th:value="${c.id}"
                  th:text="${c.name}"
                  th:selected="${person.city != null && person.city.id == c.id}"
                ></option>
              </select>
            </label>
            <span
              th:if="${#fields.hasErrors('city')}"
              th:errors="*{city}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Пол (M/F): <input th:field="*{gender}" style="width: 60px"
            /></label>
            <span
              th:if="${#fields.hasErrors('gender')}"
              th:errors="*{gender}"
              class="error"
            ></span>
          </div>
          <div>
            <button type="submit">Сохранить</button>
            <a
              th:href="@{/persons}"
              style="margin-left: 10px; color: #3498db; text-decoration: none"
              >Назад</a
            >
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
