<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить дом</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <h1>Добавить дом</h1>

    <form th:action="@{/houses/add}" th:object="${house}" method="post">
        <div class="form-group" style="flex-direction: column; gap: 15px;">
            <div>
                <label>Адрес: <input th:field="*{address}" style="width: 400px;"/></label>
                <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></span>
            </div>
            <div>
                <label>Площадь (м²): <input th:field="*{size}" style="width: 120px;"/></label>
                <span th:if="${#fields.hasErrors('size')}" th:errors="*{size}" class="error"></span>
            </div>
            <div>
                <button type="submit">Сохранить</button>
                <a th:href="@{/houses}" style="margin-left: 10px; color: #3498db; text-decoration: none;">Назад</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
