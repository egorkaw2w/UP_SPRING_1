<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title th:text="${house.id != null ? 'Редактировать дом' : 'Добавить дом'}">
      Добавить дом
    </title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/persons}" sec:authorize="hasRole('USER')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasRole('MANAGER')">Города</a>
        <a th:href="@{/houses}" sec:authorize="hasRole('ADMIN')">Дома</a>
        <span style="float: right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()"
            >Регистрация</a
          >
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>

      <h1 th:text="${house.id != null ? 'Редактировать дом' : 'Добавить дом'}">
        Добавить дом
      </h1>

      <form
        th:action="${house != null and house.id != null ? '/houses/update' : '/houses/add'}"
        th:object="${house}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />
        <div class="form-group" style="flex-direction: column; gap: 15px">
          <div>
            <label
              >Адрес: <input th:field="*{address}" style="width: 400px"
            /></label>
            <span
              th:if="${#fields.hasErrors('address')}"
              th:errors="*{address}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Площадь (м²):
              <input
                th:field="*{size}"
                type="number"
                step="0.1"
                style="width: 120px"
            /></label>
            <span
              th:if="${#fields.hasErrors('size')}"
              th:errors="*{size}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Город:
              <select th:field="*{city.id}" style="width: 300px">
                <option value="">Выберите город</option>
                <option
                  th:each="c : ${cities}"
                  th:value="${c.id}"
                  th:text="${c.name}"
                  th:selected="${house.city != null && house.city.id == c.id}"
                ></option>
              </select>
            </label>
            <span
              th:if="${#fields.hasErrors('city')}"
              th:errors="*{city}"
              class="error"
            ></span>
          </div>
          <div>
            <label
              >Владелец (опционально):
              <select th:field="*{owner.id}" style="width: 300px">
                <option value="">Нет владельца</option>
                <option
                  th:each="p : ${persons}"
                  th:value="${p.id}"
                  th:text="${p.name + ' (' + (p.city != null ? p.city.name : '') + ')'}"
                  th:selected="${house.owner != null && house.owner.id == p.id}"
                ></option>
              </select>
            </label>
          </div>
          <div>
            <button type="submit">Сохранить</button>
            <a
              th:href="@{/houses}"
              style="margin-left: 10px; color: #3498db; text-decoration: none"
              >Назад</a
            >
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
