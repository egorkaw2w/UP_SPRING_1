<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Города</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/persons}" sec:authorize="hasRole('USER')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasRole('MANAGER')">Города</a>
        <a th:href="@{/houses}" sec:authorize="hasRole('ADMIN')">Дома</a>
        <span style="float: right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()"
            >Регистрация</a
          >
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>

      <h1>Список городов</h1>

      <div th:if="${message}" class="alert success" th:text="${message}"></div>
      <div th:if="${error}" class="alert error" th:text="${error}"></div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Название города</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="city : ${cities}">
            <td th:text="${city.id}"></td>
            <td th:text="${city.name}"></td>
            <td>
              <a th:href="@{/cities/edit/{id}(id=${city.id})}" class="btn-edit"
                >Редактировать</a
              >
              <form
                th:action="@{/cities/delete/{id}(id=${city.id})}"
                method="post"
                style="display: inline"
              >
                <button
                  type="submit"
                  class="btn-delete"
                  onclick="return confirm('Вы уверены?');"
                >
                  Удалить
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <a th:href="@{/cities/add}" class="btn-add">Добавить город</a>
    </div>
  </body>
</html>
