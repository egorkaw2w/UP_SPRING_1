<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Владения</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/houses}" sec:authorize="isAuthenticated()">Дома</a>
        <a th:href="@{/persons}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Города</a>
        <a th:href="@{/notes}" sec:authorize="hasRole('ADMIN')">Заметки</a>
        <a th:href="@{/ownerships}" sec:authorize="hasRole('ADMIN')">Владения</a>

        <span style="float:right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()">Регистрация</a>
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>
      <h1>Список владений</h1>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Владелец</th>
            <th>Дом</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="o : ${ownerships}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.person != null ? o.person.name : ''}"></td>
            <td th:text="${o.house != null ? o.house.address : ''}"></td>
          </tr>
        </tbody>
      </table>
      <a th:href="@{/ownerships/add}" class="btn-add" sec:authorize="hasRole('ADMIN')">Добавить владение</a>
    </div>
  </body>
</html>
