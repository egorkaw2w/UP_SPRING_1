<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <title>Дома</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a th:href="@{/}" sec:authorize="isAuthenticated()">Главная</a>
        <a th:href="@{/houses}" sec:authorize="isAuthenticated()">Дома</a>
        <a th:href="@{/persons}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Люди</a>
        <a th:href="@{/cities}" sec:authorize="hasAnyRole('MANAGER','ADMIN')">Города</a>
        <a th:href="@{/notes}" sec:authorize="hasRole('ADMIN')">Заметки</a>
        <a th:href="@{/ownerships}" sec:authorize="hasRole('ADMIN')">Владения</a>

        <span style="float:right">
          <a th:href="@{/register}" sec:authorize="isAnonymous()">Регистрация</a>
          <a th:href="@{/login}" sec:authorize="isAnonymous()">Войти</a>
          <span sec:authorize="isAuthenticated()">
            <span th:text="${#authentication?.name}"></span>
            &nbsp;|&nbsp;
            <a th:href="@{/logout}">Выйти</a>
          </span>
        </span>
      </div>
      <h1>Список домов</h1>

      <div th:if="${message}" class="alert success" th:text="${message}"></div>
      <div th:if="${error}" class="alert error" th:text="${error}"></div>

      <form method="get" class="form-group">
        <input
          type="text"
          name="addressFilter"
          placeholder="Адрес"
          th:value="${param.addressFilter}"
        />
        <input
          type="number"
          step="0.1"
          name="minSize"
          placeholder="Мин. площадь"
          th:value="${param.minSize}"
        />
        <select name="sortBy">
          <option value="">Сортировка</option>
          <option value="address" th:selected="${param.sortBy == 'address'}">
            По адресу
          </option>
          <option value="size" th:selected="${param.sortBy == 'size'}">
            По площади
          </option>
        </select>
        <button type="submit">Фильтр</button>
      </form>

      <form method="post" id="bulkForm">
        <table>
          <thead>
            <tr>
              <th>
                <input type="checkbox" id="selectAll" onclick="toggleAll()" />
              </th>
              <th>ID</th>
              <th>Адрес</th>
              <th>Площадь</th>
              <th>Удалено</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr
              th:each="h : ${houses}"
              th:classappend="${h.deleted} ? 'deleted-row'"
            >
              <td>
                <input
                  type="checkbox"
                  name="ids"
                  th:value="${h.id}"
                  class="select-checkbox"
                />
              </td>
              <td th:text="${h.id}"></td>
              <td th:text="${h.address}"></td>
              <td th:text="${h.size}"></td>
              <td th:text="${h.deleted} ? 'Да' : 'Нет'"></td>
              <td>
                <button
                  type="submit"
                  th:formaction="@{/houses/delete/{id}(id=${h.id})}"
                  class="btn-delete"
                >
                  Физ.
                </button>
                <button
                  type="submit"
                  th:formaction="@{/houses/logical-delete/{id}(id=${h.id})}"
                  class="btn-logical"
                  th:unless="${h.deleted}"
                >
                  Лог.
                </button>
                <button
                  type="submit"
                  th:formaction="@{/houses/restore/{id}(id=${h.id})}"
                  class="btn-restore"
                  th:if="${h.deleted}"
                >
                  Восстановить
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <div
          class="bulk-actions"
          th:if="${houses != null && !houses.isEmpty()}"
        >
          <button
            type="submit"
            th:formaction="@{/houses/logical-delete-multiple}"
            class="btn-logical-mass"
          >
            Логически удалить выбранные
          </button>
          <button
            type="submit"
            th:formaction="@{/houses/delete-multiple}"
            class="btn-delete-mass"
          >
            Физически удалить выбранные
          </button>
        </div>
      </form>

      <a th:href="@{/houses/add}" class="btn-add">Добавить дом</a>
    </div>

    <script>
      function toggleAll() {
        const checked = document.getElementById("selectAll").checked;
        document
          .querySelectorAll(".select-checkbox")
          .forEach((cb) => (cb.checked = checked));
      }
    </script>
  </body>
</html>
